<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon32.png" width="24" height="24" alt="" />
      <b>Смены — прибыль</b>
      <span id="dot" class="dot"></span>
    </header>

    <section id="connect" hidden>
      <p>Вставьте код подключения из приложения: <b>Профиль → Расширение → Получить код</b>.</p>
      <textarea id="code" rows="3" placeholder="https://…#smn_…"></textarea>
      <button id="connectBtn" class="primary">Подключить</button>
    </section>

    <section id="main" hidden>
      <div class="hello">Привет, <b id="name"></b></div>

      <div class="card today">
        <div class="lbl">Прибыль сегодня</div>
        <div class="big" id="profit">—</div>
        <div class="bar"><i id="goalBar"></i></div>
        <div class="row small"><span id="goal"></span><span id="earned"></span></div>
      </div>

      <div class="card">
        <div class="lbl">Слежение за суммой</div>
        <div id="watchNone">
          <p class="small">Откройте рабочий сайт, нажмите кнопку и кликните по сумме прибыли на странице.</p>
          <button id="pick" class="primary">Выбрать сумму на этой странице</button>
        </div>
        <div id="watchOn" hidden>
          <div class="site"><span id="site"></span><span id="sample" class="muted"></span></div>
          <label class="field">Как считать
            <select id="mode">
              <option value="counter">На странице общая сумма — считать прирост</option>
              <option value="amount">Каждое новое число — отдельная прибыль</option>
            </select>
          </label>
          <label class="check"><input type="checkbox" id="enabled" /> Отправлять изменения</label>
          <label class="check"><input type="checkbox" id="badge" /> Значок на странице</label>
          <div class="row">
            <button id="repick">Выбрать заново</button>
            <button id="unwatch" class="ghost">Убрать</button>
          </div>
        </div>
        <div id="err" class="err" hidden></div>
        <div id="last" class="small muted"></div>
      </div>

      <div class="card">
        <div class="lbl">Добавить вручную</div>
        <div class="row">
          <input id="amount" inputmode="decimal" placeholder="Сумма, сом" />
          <button id="add" class="primary">＋</button>
        </div>
        <input id="note" placeholder="Комментарий (необязательно)" maxlength="200" />
      </div>

      <footer>
        <a id="open" href="#" target="_blank">Открыть приложение</a>
        <button id="logout" class="ghost small">Отключить</button>
      </footer>
    </section>
    <script src="popup.js"></script>
  </body>
</html>
